/* ========================================================================
 * [D] 模擬後端 API
 *  - 每次呼叫都有隨機延遲（模擬網路）
 *  - 可在側邊欄開啟「模擬 API 錯誤」展示失敗情境
 *  - §3.2「所有權限皆在後端強制檢查」：即使繞過畫面，act() 仍會拒絕（403）
 *  - fn 拋出例外時整批回滾（模擬交易）
 *  日後接真實 API：把 act() 內的 fn() 改為 fetch()，回傳 {ok, r} 即可
 * ====================================================================== */
class ApiError extends Error{constructor(status,msg){super(msg);this.status=status}}
async function act(opts,fn,okMsg){
  loading(true);
  try{
    await sleep(MOCK.apiDelay[0]+Math.random()*(MOCK.apiDelay[1]-MOCK.apiDelay[0]));
    if(ui.simulateError)throw new ApiError(503,'模擬錯誤：伺服器暫時無法回應，資料未儲存，請稍後再試。');
    if(opts&&opts.perm){
      const need=opts.level||'edit',a=access(opts.perm);
      if(a==='none'||(need==='edit'&&a!=='edit'))throw new ApiError(403,`權限不足：「${MOCK.permMatrix[opts.perm].label}」需要${need==='edit'?'編輯':'檢視'}權限（後端拒絕）`);
    }
    const snapshot=JSON.stringify(db);
    let r;try{r=fn?fn():undefined}catch(e){db=JSON.parse(snapshot);throw e}
    save();
    if(okMsg)toast(okMsg,'ok');
    return {ok:true,r};
  }catch(e){
    if(!(e instanceof ApiError))console.error(e);
    toast((e.status?`[${e.status}] `:'')+(e.message||'發生未預期錯誤'),'err');
    return {ok:false,e};
  }finally{loading(false)}
}

function dialog({title,body='',buttons=[{label:'確定',value:true,cls:'primary'}],onOpen,wide}){
  return new Promise(resolve=>{
    const root=document.createElement('div');root.className='modalback';
    root.innerHTML=`<div class="modal ${wide?'wide':'small'}" role="alertdialog" aria-modal="true"><div class="modalhead"><h3>${title}</h3><button class="close" type="button" aria-label="關閉">×</button></div><div class="modalbody">${body}</div><div class="modalfoot">${buttons.map((b,i)=>`<button type="button" class="btn ${b.cls||'secondary'}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    $('#dialogroot').appendChild(root);
    const close=v=>{root.remove();resolve(v)};root._close=close;
    root.querySelector('.close').onclick=()=>close(null);
    $$('[data-i]',root).forEach(btn=>btn.onclick=async()=>{
      const b=buttons[+btn.dataset.i];
      if(b.validate){btn.disabled=true;const v=await b.validate(root);btn.disabled=false;if(v===false)return;close(v)}else close(b.value);
    });
    if(onOpen)onOpen(root);
    const first=root.querySelector('input,select,textarea');if(first)setTimeout(()=>first.focus(),30);
  });
}

function fieldHTML(f,v,ro){

function setErr(root,k,msg){
  const fe=root.querySelector(`[data-field="${k}"]`);if(!fe)return;
  fe.classList.toggle('invalid',!!msg);
  let m=[...fe.children].find(x=>x.classList&&x.classList.contains('errmsg'));
  if(!m){m=document.createElement('small');m.className='errmsg';fe.appendChild(m)}
  m.textContent=msg||'';
}

// 讀取並驗證一組欄位（必填、數字、Email），失敗回傳 false
function collect(root,defs,silent){
  let ok=true;const out={};
  defs.forEach(f=>{
    const el=root.querySelector('#f_'+f.k);if(!el)return;
    let v;if(f.t==='checkbox')v=el.checked;else{v=el.value.trim();if(f.t==='number')v=v===''?'':Number(v)}
    const empty=v===''||v==null;setErr(root,f.k,'');
    if(f.req&&empty){setErr(root,f.k,'此欄位為必填');ok=false}
    else if(f.t==='number'&&!empty&&(isNaN(v)||(f.min!=null&&v<f.min))){setErr(root,f.k,f.min!=null?`需為不小於 ${f.min} 的數字`:'請輸入數字');ok=false}
    else if(f.t==='email'&&!empty&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){setErr(root,f.k,'Email 格式不正確');ok=false}
    out[f.k]=v;
  });
  if(!ok&&!silent)toast('請修正標示紅色的欄位','err');
  return ok?out:false;
}

  return {file:{id,name:file.name,size:file.size,at:nowStr(),by:currentUser()?.name||''}};
}
function initFileField(el,files){
  el._files=(files||[]).filter(Boolean).map(x=>({...x}));
  const multi=el.dataset.multi==='1',ro=el.dataset.ro==='1',kind=el.dataset.kind;
  const draw=errText=>{
    el.innerHTML=`<div class="filechips">${el._files.map((f,i)=>`<span class="filechip"><a class="filelink" data-prev="${i}">${esc(f.name)}</a><small class="muted">${fsize(f.size)}</small>${ro?'':`<button type="button" data-rm="${i}" title="移除" aria-label="移除檔案">×</button>`}</span>`).join('')||'<span class="muted" style="font-size:11px">尚未上傳</span>'}</div>${ro?'':`<input type="file" ${multi?'multiple':''} accept="${acceptAttr(kind)}"><small class="authhint">允許 ${MOCK.upload[kind].join('、').toUpperCase()}；單檔上限 ${MOCK.upload.maxMB}MB</small>`}<small class="errmsg">${esc(errText||'')}</small>`;
    $$('[data-rm]',el).forEach(b=>b.onclick=()=>{el._files.splice(+b.dataset.rm,1);draw()});
    $$('[data-prev]',el).forEach(a=>a.onclick=()=>previewFile(el._files[+a.dataset.prev]));
    const inp=el.querySelector('input[type=file]');
    if(inp)inp.onchange=()=>{
      const errs=[];
      [...inp.files].forEach(file=>{const r=acceptFile(file,kind);if(r.err)errs.push(r.err);else if(multi)el._files.push(r.file);else el._files=[r.file]});

      if(errs.length)toast(errs[0],'err');else if(inp.files.length)toast(`已選取 ${inp.files.length} 個檔案`,'ok');
    };
  };
  draw();
}

function previewFile(f,ctx={}){

function mockPreview(f,ext,ctx){
  const note=`<p class="authhint">※ 模擬預覽：展示資料沒有實體檔案；正式版由伺服器轉檔後顯示原始內容（${esc(ext.toUpperCase())}）。本次瀏覽新選取的 PDF／JPG／PNG 會直接顯示實際檔案。</p>`;
  const o=ctx.order;
  if(o&&(f.mock==='po'||['pdf','jpg','jpeg','png','tif','tiff'].includes(ext)))return `<div class="preview-doc"><h2>PURCHASE ORDER</h2><div class="muted">FAX · From: ${esc(o.customer)}　To: ${esc(MOCK.company.en)}（${esc(MOCK.company.name)}）</div><p>PO#: <b>${esc(o.customerPO)}</b>　Date: ${esc(o.date)}　Ship to: ${esc(o.ship)}</p>${table(['Part No.','Description','Qty','Unit Price'],o.lines.map(l=>`<tr><td>${esc(l.product)}</td><td>${esc(l.description)}</td><td>${fmt(l.qty,0)} ${esc(l.unit)}</td><td>${fmt(l.price)} ${esc(o.currency)}</td></tr>`).join(''))}<p>Required delivery: ${esc(o.delivery||'—')}　Signature: ________</p></div>${note}`;
  if(['xls','xlsx'].includes(ext))return `<div class="preview-doc">${table(['A','B','C','D'],(o?o.lines:[{product:'—',description:'—',qty:0,price:0}]).map(l=>`<tr><td>${esc(l.product)}</td><td>${esc(l.description)}</td><td>${l.qty}</td><td>${l.price}</td></tr>`).join(''))}</div>${note}`;
  if(['eml','msg'].includes(ext))return `<div class="preview-doc"><p><b>From:</b> ${esc(o?.contact||'customer')} &lt;${esc(db.customers.find(c=>c.id===o?.customerId)?.email||'—')}&gt;<br><b>Subject:</b> New PO ${esc(o?.customerPO||'')}<br><b>Date:</b> ${esc(o?.date||'')}</p><hr><p>Dear team,<br>Please find our new purchase order below. Kindly confirm delivery date.<br><br>Best regards,<br>${esc(o?.contact||'')}</p></div>${note}`;
  if(f.mock==='drawing'||f.mock==='photo'||['jpg','jpeg','png','pdf'].includes(ext))return `<img src="${partSVG(f.name,'DRAWING PREVIEW (MOCK)')}" alt="" style="width:100%;max-height:60vh;object-fit:contain;border:1px solid var(--line);border-radius:8px">${note}`;
  return `<div class="preview-doc"><h2>${esc(f.name)}</h2><p class="muted">文件內容預覽（模擬）</p></div>${note}`;
}
function downloadFile(f){
  const sf=f&&sessionFiles.get(f.id);
  if(sf){const a=document.createElement('a');a.href=sf.url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();return}
  toast(`「${f?.name||''}」為展示資料，無實體檔案；正式版由伺服器提供下載`,'info');
}
function diffText(old,obj,fields){
  const disp=(f,v)=>{if(v==null||v==='')return '';if(f.t==='file')return v?.name||'';if(f.t==='files')return (v||[]).map(x=>x.name).join('、');if(f.t==='ref')return refLabel(f.ref,v);if(f.k==='active')return v===false?'停用':'啟用';if(f.t==='checkbox')return v?'是':'否';return String(v)};
  return fields.map(f=>{const a=disp(f,old[f.k]),b=disp(f,obj[f.k]);return a!==b?`${f.l}：${a||'（空）'} → ${b||'（空）'}`:null}).filter(Boolean).join('；')||'無欄位變更';
}

function lineCount(pred){return db.orders.reduce((a,o)=>a+o.lines.filter(pred).length,0)}
function priceAt(productId,date){return db.prices.filter(x=>x.productId===productId&&x.effective<=(date||today())).sort((a,b)=>b.effective.localeCompare(a.effective))[0]||null}
function fileLink(coll,id,field){const r=db[coll].find(x=>x.id===id);const f=r?.[field];return f?`<a class="filelink" onclick="previewRef('${coll}','${id}','${field}')">${esc(f.name)}</a>`:'<span class="muted">—</span>'}

function genericRows(key,data){
  const c=configs[key];
  return data.map(r=>`<tr class="${r.active===false?'dim':''}">${c.cols.map(([k,,fn])=>`<td>${fn?fn(r):(r[k]===''||r[k]==null?'<span class="muted">—</span>':esc(r[k]))}</td>`).join('')}<td><div class="rowactions">${rowActions(key,r)}</div></td></tr>`).join('');
}
function rowActions(key,r){
  const c=configs[key],ed=canEdit(c.perm);
  let h=`<button class="mini" onclick="openForm('${key}','${r.id}')">${ed?'編輯':'檢視'}</button>`;
  if(c.extraActions)h+=c.extraActions(r);
  if(ed&&!c.noDelete&&key!=='accounting')h+=r.active===false?`<button class="mini" onclick="toggleActive('${key}','${r.id}',true)">重新啟用</button>`:`<button class="mini red" onclick="removeRow('${key}','${r.id}')">${c.usedBy&&c.usedBy(r)>0?'停用':'刪除'}</button>`;
  if(ed&&key==='accounting'&&r.source==='手動')h+=`<button class="mini red" onclick="removeRow('${key}','${r.id}')">刪除</button>`;
  return h;
}
function filterData(key){const q=norm(ui.search),c=configs[key];let data=(db[key]||[]).slice();if(c.sort)data.sort(c.sort);return q?data.filter(r=>norm(JSON.stringify(r)+' '+c.cols.map(([k,,fn])=>fn?String(fn(r)).replace(/<[^>]+>/g,''):'').join(' ')).includes(q)):data}
function modulePage(key){
  const c=configs[key],data=filterData(key);
  const hs=c.cols.map(x=>x[1]).concat('操作');
  return head(c.desc,canEdit(c.perm)?`<button class="btn primary" onclick="openForm('${key}')">＋ 新增${c.label}</button>`:'')+(c.notice||'')+(canEdit(c.perm)?'':`<div class="notice blue">您目前的角色對「${MOCK.permMatrix[c.perm].label}」僅有檢視權限。</div>`)+toolbar(`搜尋${c.label}...`)+panel(`${c.label}清單`,`共 ${data.length} 筆${ui.search?`（篩選自 ${db[key].length} 筆）`:''}`,table(hs,genericRows(key,data),ui.search?`沒有符合「${esc(ui.search)}」的資料`:`目前沒有${c.label}資料`));
}
function openForm(key,id,preset={}){
  const c=configs[key],old=id?db[key].find(x=>x.id===id):null,ro=!canEdit(c.perm);
  if(!old&&ro)return toast('您沒有新增權限','err');
  const v=old?clone(old):{...(c.defaults?c.defaults():{}),...preset};
  const body=`${ro?'<div class="notice blue">您目前的角色僅有檢視權限。</div>':''}<div class="formgrid">${c.fields.map(f=>fieldHTML(f,f.k==='active'?(v.active===false?'停用':'啟用'):v[f.k],ro)).join('')}</div>${old&&c.usedBy&&c.usedBy(old)>0?`<p class="authhint">此筆資料已被使用 ${c.usedBy(old)} 次，只能停用、不能刪除。</p>`:''}`;
  const m=showModal((ro?'檢視':old?'編輯':'新增')+c.label,body,ro?`<button class="btn secondary" onclick="closeModal()">關閉</button>`:`<button class="btn secondary" onclick="closeModal()">取消</button><button class="btn primary" id="saveBtn">儲存資料</button>`,{noBackdropClose:!ro});
  $$('.filefield',m).forEach(el=>{const f=c.fields.find(x=>x.k===el.dataset.k);initFileField(el,f.t==='file'?(v[f.k]?[v[f.k]]:[]):v[f.k])});
  if(!ro)$('#saveBtn').onclick=()=>saveForm(key,id);
}
async function saveForm(key,id){
  const c=configs[key],m=$('#modalroot .modal'),old=id?db[key].find(x=>x.id===id):null;
  const plain=c.fields.filter(f=>!['file','files'].includes(f.t));
  const v=collect(m,plain);if(!v)return;
  const obj=old?clone(old):{id:uid(c.prefix)};Object.assign(obj,v);
  let bad=false;
  c.fields.filter(f=>['file','files'].includes(f.t)).forEach(f=>{const el=$(`.filefield[data-k="${f.k}"]`,m),files=el?._files||[];obj[f.k]=f.t==='file'?(files[0]||null):files;if(f.req&&!files.length){setErr(m,f.k,'請上傳檔案');bad=true}});
  if('active' in v)obj.active=v.active!=='停用';
  const errs=c.validate?c.validate(obj,old):null;if(errs)Object.entries(errs).forEach(([k,msg])=>{setErr(m,k,msg);bad=true});
  const dup=c.unique?c.unique(obj):null;if(dup){setErr(m,c.uniqueField,dup);bad=true}
  if(bad){toast(dup||'請修正標示紅色的欄位','err');return}
  const btn=$('#saveBtn');btn.disabled=true;btn.textContent='儲存中…';
  const res=await act({perm:c.perm},()=>{
    const d=c.unique?c.unique(obj):null;if(d)throw new ApiError(409,d); // 後端再檢查一次重複
    const i=db[key].findIndex(x=>x.id===obj.id);if(i>=0)db[key][i]=obj;else db[key].push(obj);
    log(old?'修改':'新增',c.label,c.title(obj),old?diffText(old,obj,c.fields):'建立資料');
  },`${c.label}已${old?'更新':'新增'}`);
  if(!res.ok){btn.disabled=false;btn.textContent='儲存資料';return}
  closeModal();render();
}
// §8 已使用的選項與資料以停用取代刪除
async function removeRow(key,id){
  const c=configs[key],r=db[key].find(x=>x.id===id);if(!r)return;
  const used=c.usedBy?c.usedBy(r):0;
  if(used>0){
    if(!await confirmDlg('停用資料',`「${c.title(r)}」已被 ${used} 筆資料使用，依規格只能停用、不能刪除。\n停用後不再出現在下拉選單中，歷史資料完整保留。`,'停用'))return;
    await act({perm:c.perm},()=>{r.active=false;log('停用',c.label,c.title(r),'已被使用，改為停用')},'已停用');
  }else{
    if(!await confirmDlg('刪除資料',`確定刪除「${c.title(r)}」？此資料尚未被使用。`,'刪除',true))return;
    await act({perm:c.perm},()=>{db[key]=db[key].filter(x=>x.id!==id);log('刪除',c.label,c.title(r),'')},'已刪除');
  }
  render();
}

/* ========================================================================
 * [G] 訂單狀態計算（§4.4.2）
 *  四層狀態：訂單（整張）／生產（明細）／檢驗（品項）／出貨（批次）
 *  主狀態由系統自動判斷，只有「暫停處理」「取消」「結案」可手動
 * ====================================================================== */
const ORDER_FLOW=['草稿','待下單給工廠','生產中','待檢驗','檢驗不合格／待重做','待出貨','部分出貨','已全部出貨','已結案'];
const TOL=MOCK.qtyTolerance;
const getOrder=id=>db.orders.find(o=>o.id===id);
const orderTotal=o=>o.lines.reduce((a,l)=>a+(Number(l.qty)||0)*(Number(l.price)||0),0);
const orderShipments=o=>db.shipments.filter(s=>s.orderId===o.id);
// 假設：只有狀態為「已出貨」的批次才計入累計出貨量；補發批次（客訴）不計入原訂單數量
function lineShipped(o,l,{includePending=false,excludeId}={}){return orderShipments(o).filter(s=>!s.isReplacement&&s.id!==excludeId&&(includePending||s.status==='已出貨')).reduce((a,s)=>a+(s.lines.find(x=>x.lineId===l.id)?.qty||0),0)}
function lineInsps(o,l){return db.inspection.filter(i=>i.orderId===o.id&&i.lineId===l.id).sort((a,b)=>a.round-b.round)}
function lineInspStatus(o,l){if((l.prod?.status)!=='生產完成')return '—';const r=lineInsps(o,l);if(!r.length)return '待檢驗';return r[r.length-1].result==='合格'?'合格':'待重做'}
// 假設：累計出貨 ≥ 訂單數量 × 90% 即視為該品項出貨完成（§4.4.2「判斷已全部出貨時須一併考慮容許範圍」）
const lineDone=(o,l)=>lineShipped(o,l)>=l.qty*(1-TOL);
function lineShipStatus(o,l){const s=lineShipped(o,l);if(s<=0)return '待出貨';return lineDone(o,l)?'已出貨':'部分出貨'}
// 假設：多品項時，出貨前階段以「最落後的品項」代表整張訂單；有任一品項檢驗不合格時優先顯示不合格
function deriveStatus(o){
  if(o.cancelled)return '已取消';
  if(o.closed)return '已結案';
  if(o.hold)return '暫停處理';
  if(!o.confirmed)return '草稿';
  const L=o.lines;if(!L.length)return '待下單給工廠';
  if(L.every(l=>lineDone(o,l)))return '已全部出貨';
  if(L.some(l=>lineShipped(o,l)>0))return '部分出貨';
  if(L.some(l=>lineInspStatus(o,l)==='待重做'))return '檢驗不合格／待重做';
  if(L.some(l=>(l.prod?.status||'未下單')==='未下單'))return '待下單給工廠';
  if(L.some(l=>l.prod?.status==='生產中'))return '生產中';
  if(L.some(l=>lineInspStatus(o,l)!=='合格'))return '待檢驗';
  return '待出貨';
}
// 狀態變更一律寫入訂單歷程與修改紀錄（§4.4.2(六)）
function refreshOrder(o,note){
  if(!o)return;const s=deriveStatus(o);
  if(o.status!==s){(o.history=o.history||[]).push({at:nowStr(),by:userLabel(),from:o.status||'—',to:s,note:note||'系統自動判斷'});log('狀態變更','訂單',o.id,`${o.status||'—'} → ${s}${note?`（${note}）`:''}`);o.status=s}
}

// ---- 搜尋式下拉（§4.4 下拉選取與自動填入）----
function makeAuto(input,{items,label,meta,value,exact,onPick,onUnknown,onClear}){
  const menu=document.createElement('div');menu.className='autocomplete-menu hidden';input.parentElement.appendChild(menu);
  value=value||label;let filtered=[],active=-1;
  const hl=()=>$$('.autocomplete-option',menu).forEach((b,i)=>b.classList.toggle('active',i===active));
  const pick=x=>{input.value=value(x);input.dataset.resolved=norm(input.value);menu.classList.add('hidden');onPick(x)};
  const open=()=>{
    const q=norm(input.value);filtered=items().filter(x=>!q||norm(label(x)).includes(q)||norm(meta(x)).includes(q)).slice(0,50);active=-1;
    menu.innerHTML=filtered.length?filtered.map((x,i)=>`<button type="button" class="autocomplete-option" data-i="${i}"><strong>${esc(label(x))}</strong><small>${esc(meta(x))}</small></button>`).join(''):`<div class="autocomplete-empty">沒有符合「${esc(input.value)}」的資料。可直接輸入新資料，離開欄位時選擇是否加入主檔。</div>`;
    menu.classList.remove('hidden');
    $$('.autocomplete-option',menu).forEach(b=>b.addEventListener('mousedown',e=>{e.preventDefault();pick(filtered[+b.dataset.i])}));
  };
  input.addEventListener('focus',open);input.addEventListener('click',open);
  input.addEventListener('input',()=>{delete input.dataset.resolved;onClear&&onClear();open()});
  input.addEventListener('keydown',e=>{
    if(menu.classList.contains('hidden'))return;
    if(e.key==='ArrowDown'){e.preventDefault();active=Math.min(active+1,filtered.length-1);hl()}
    else if(e.key==='ArrowUp'){e.preventDefault();active=Math.max(active-1,0);hl()}
    else if(e.key==='Enter'){e.preventDefault();const x=filtered[active>=0?active:0];if(x)pick(x)}
    else if(e.key==='Escape'){e.stopPropagation();menu.classList.add('hidden')}
  });
  input.addEventListener('blur',()=>setTimeout(()=>{
    menu.classList.add('hidden');const v=input.value.trim();
    if(!v||input.dataset.resolved===norm(v))return;
    const ex=exact?exact(v):items().find(x=>norm(value(x))===norm(v));
    if(ex==='ambiguous'){toast('此料號有多個版本，請從清單中選擇版本','warn');return}
    if(ex){pick(ex);return}
    input.dataset.resolved=norm(v);onUnknown&&onUnknown(v);
  },180));
}

      if(!old){obj.id=nextOrderId(obj.date);obj.createdBy=userLabel();obj.createdAt=nowStr();obj.history=[{at:nowStr(),by:userLabel(),from:'—',to:'草稿',note:'建立訂單'}];obj.status='草稿';db.orders.push(obj);log('新增','訂單',obj.id,`${obj.customer}｜${lines.length} 項｜總額 ${fmt(orderTotal(obj))} ${obj.currency}`)}

function orderDiff(a,b){
  const F=[['date','訂單日期'],['customer','客戶'],['contact','下單聯絡人'],['customerPO','客戶 PO'],['ship','寄送地址'],['bill','付款地址'],['currency','幣別'],['hts','HTS'],['delivery','送貨日']];
  const out=F.filter(([k])=>String(a[k]??'')!==String(b[k]??'')).map(([k,l])=>`${l}：${a[k]||'（空）'} → ${b[k]||'（空）'}`);
  b.lines.forEach(l=>{const ol=a.lines.find(x=>x.id===l.id);if(!ol){out.push(`新增品項 ${l.product}×${l.qty}`);return}[['product','產品'],['supplier','供應商'],['qty','數量'],['price','單價'],['handling','產品處理'],['drawing','圖面']].forEach(([k,lab])=>{if(String(ol[k]??'')!==String(l[k]??''))out.push(`${l.product} ${lab}：${ol[k]||'（空）'} → ${l[k]||'（空）'}`)})});
  a.lines.filter(ol=>!b.lines.some(l=>l.id===ol.id)).forEach(ol=>out.push(`移除品項 ${ol.product}`));
  if((a.attachments||[]).length!==(b.attachments||[]).length)out.push(`附件 ${(a.attachments||[]).length} → ${(b.attachments||[]).length} 個`);
  return out.join('；')||'無欄位變更';
}

  return `<div class="legrow" data-leg="${i}"><div class="field" data-field="from"><label>起點</label><input data-lk="from" value="${esc(g.from)}" ${dis} placeholder="例：A 供應商"></div><div class="field" data-field="to"><label>迄點</label><input data-lk="to" value="${esc(g.to)}" ${dis} placeholder="例：客戶倉庫"></div><div class="field"><label>運輸方式</label>${sel('method',['空運','海運','陸運'].map(x=>[x,x]))}</div><div class="field"><label>運費金額</label><input data-lk="freight" type="number" min="0" step="any" value="${esc(g.freight)}" ${dis}></div><div class="field"><label>幣別</label>${sel('currency',MOCK.currencies.map(x=>[x,x]))}</div><div class="field"><label>付款方</label>${sel('payer',[['供應商墊付','供應商墊付'],['公司自付','公司自付']])}</div><div class="field" data-field="payeeId"><label>應付對象</label>${sel('payeeId',[['','（不計入應付）'],...db.suppliers.filter(s=>s.active!==false||s.id===g.payeeId).map(s=>[s.id,`${s.name}（${s.type}）`])])}</div><div class="field"><label>運送單號</label><input data-lk="trackNo" value="${esc(g.trackNo)}" ${dis}></div>${ro?'':`<button type="button" class="mini red" data-rmleg title="移除此段">×</button>`}</div>`;
}
function openShipmentForm(opt={}){
  const old=opt.id?db.shipments.find(s=>s.id===opt.id):null;
  const oo=old?getOrder(old.orderId):null;
  const ro=!canEdit('shipments')||!!(oo&&(oo.closed||oo.cancelled));
  if(!old&&ro)return toast('您沒有新增出貨批次的權限','err');
  const s=old?clone(old):{id:null,orderId:opt.orderId||'',lines:[],exportNo:'',exportDate:'',rate:32.4,planned:'',actual:'',eta:'',received:'',status:'待出貨',track:'未出貨',legs:[newLeg()],reportEmailed:false,isReplacement:false};
  const orders=db.orders.filter(o=>o.id===s.orderId||(o.confirmed&&!o.cancelled&&!o.closed&&!o.hold));
  // 假設：§4.5「匯率」記錄於出貨批次，代表該批訂單幣別 → 台幣的匯率；運費若為其他外幣亦以此匯率換算
  const F=[{k:'exportNo',l:'出口報單號碼'},{k:'exportDate',l:'出口報單日期',t:'date',hint:'決定月結歸屬月份（§4.8）'},{k:'rate',l:'匯率（訂單幣別 → TWD）',t:'number',min:0},{k:'planned',l:'預計出貨日',t:'date'},{k:'actual',l:'實際出貨日',t:'date'},{k:'eta',l:'預計收件日（客戶）',t:'date',hint:'用於剩餘收件日提醒（§4.9）'},{k:'received',l:'實際收件日',t:'date'},{k:'status',l:'出貨狀態',t:'select',opts:['待出貨','已出貨']},{k:'track',l:'追蹤狀態',t:'select',opts:['未出貨','運送中','已送達']},{k:'reportEmailed',l:'檢驗報告',t:'checkbox',cl:'已以 Email 寄送檢驗報告給國外客戶（§4.6）'}];
  const body=`${ro?'<div class="notice blue">僅可檢視此出貨批次。</div>':''}${s.isReplacement?`<div class="notice">此為客訴 ${esc(s.complaintId)} 的補發批次：不計入原訂單出貨數量，亦不扣應付帳款（§4.7）。</div>`:''}
  <div class="formgrid"><div class="field full" data-field="orderId"><label>訂單<span class="req">*</span></label><select id="sh_order" ${old||ro?'disabled':''}><option value="">請選擇訂單（僅列出已確認、未暫停／取消／結案的訂單）</option>${orders.map(o=>`<option value="${o.id}" ${o.id===s.orderId?'selected':''}>${esc(o.id)}｜${esc(o.customer)}｜${esc(o.status)}</option>`).join('')}</select><small class="errmsg"></small></div></div>
  <h4 class="sect">批次明細（品項、數量）</h4><div id="sh_lines"></div>
  <h4 class="sect">出口報單、匯率與日期</h4><div class="formgrid">${F.map(f=>fieldHTML(f,s[f.k],ro)).join('')}</div>
  <h4 class="sect">運送段（一批可有 1 段或多段）</h4><p class="authhint">常見情境：直接空運／直接海運／A 供應商寄 B 供應商，再由 B 空運或海運（2 段）。「供應商墊付」的運費計入該供應商應付；「公司自付」計入貨運公司應付。</p><div id="sh_legs">${s.legs.map((g,i)=>legHTML(g,i,ro)).join('')}</div>${ro?'':'<button type="button" class="btn secondary" id="sh_addleg">＋ 新增運送段</button>'}`;
  const m=showModal(old?`出貨批次 ${esc(s.id)}`:'新增出貨批次',body,ro?'<button class="btn secondary" onclick="closeModal()">關閉</button>':'<button class="btn secondary" onclick="closeModal()">取消</button><button class="btn primary" id="sh_save">儲存出貨批次</button>',{wide:true,noBackdropClose:!ro});
  const drawLines=()=>{
    const o=getOrder($('#sh_order',m).value);const box=$('#sh_lines',m);
    if(!o){box.innerHTML='<div class="empty">請先選擇訂單</div>';return}
    box.innerHTML=table(['產品 / 版本','訂單數量','檢驗','其他批次已安排','剩餘可出','本批數量'],o.lines.map(l=>{
      const passed=s.isReplacement||lineInspStatus(o,l)==='合格',other=lineShipped(o,l,{includePending:true,excludeId:s.id}),remain=l.qty-other,cur=s.lines.find(x=>x.lineId===l.id)?.qty??'';
      return `<tr class="${passed?'':'dim'}"><td><b>${esc(l.product)}</b> / ${esc(l.version)}<br><small class="muted">${esc(l.description)}</small></td><td>${fmt(l.qty,0)} ${esc(l.unit)}</td><td>${s.isReplacement?'<span class="tag orange">補發</span>':tag(lineInspStatus(o,l))}</td><td>${fmt(other,0)}</td><td>${fmt(Math.max(remain,0),0)}</td><td><input type="number" min="0" step="1" style="width:110px" data-shline="${l.id}" data-max="${l.qty*(1+TOL)-other}" value="${esc(cur)}" ${passed&&!ro?'':'disabled'} placeholder="${passed?Math.max(remain,0):'未合格'}">${passed?'':'<br><small class="danger-text">未檢驗合格，不可出貨</small>'}</td></tr>`}).join(''));
  };
  drawLines();
  if(!old&&!ro)$('#sh_order',m).onchange=()=>{s.lines=[];drawLines()};
  const legBox=$('#sh_legs',m);
  const bindLegs=()=>$$('[data-rmleg]',legBox).forEach(b=>b.onclick=()=>{if($$('.legrow',legBox).length<=1)return toast('至少需要一段運送','warn');b.closest('.legrow').remove()});
  bindLegs();
  if(!ro){
    $('#sh_addleg',m).onclick=()=>{legBox.insertAdjacentHTML('beforeend',legHTML(newLeg(),$$('.legrow',legBox).length,false));bindLegs()};
    $('#f_received',m).addEventListener('change',e=>{if(e.target.value){$('#f_track',m).value='已送達';$('#f_status',m).value='已出貨'}});
    $('#f_actual',m).addEventListener('change',e=>{if(e.target.value&&$('#f_status',m).value==='待出貨'){$('#f_status',m).value='已出貨';if($('#f_track',m).value==='未出貨')$('#f_track',m).value='運送中';toast('已填實際出貨日，狀態自動改為「已出貨」','info')}});
    $('#sh_save',m).onclick=async()=>{
      clearErrs(m);let bad=false;
      const orderId=$('#sh_order',m).value;if(!orderId){setErr(m,'orderId','請選擇訂單');bad=true}
      const o=getOrder(orderId);
      const lines=$$('[data-shline]',m).map(inp=>({lineId:inp.dataset.shline,qty:num(inp.value)||0,max:Number(inp.dataset.max)})).filter(x=>x.qty>0);
      if(o&&!lines.length){toast('請至少輸入一個品項的出貨數量','err');bad=true}
      if(lines.some(x=>!Number.isInteger(x.qty))){toast('出貨數量需為整數','err');bad=true}
      const v=collect(m,F,true);if(!v)bad=true;
      if(v){
        if(v.status==='已出貨'&&!v.actual){setErr(m,'actual','已出貨需填寫實際出貨日');bad=true}
        if(v.exportDate&&!v.exportNo){setErr(m,'exportNo','填寫出口報單日期時，需同時填寫報單號碼');bad=true}
        if((v.exportDate||v.status==='已出貨')&&!(v.rate>0)){setErr(m,'rate','已出貨或已報關需填寫匯率');bad=true}
        if(v.received&&v.actual&&v.received<v.actual){setErr(m,'received','實際收件日不可早於實際出貨日');bad=true}
        if(v.received&&v.status!=='已出貨'){setErr(m,'status','已收件的批次狀態需為已出貨');bad=true}
      }
      const legs=$$('.legrow',legBox).map(row=>{const g={};$$('[data-lk]',row).forEach(el=>g[el.dataset.lk]=el.value.trim());g.freight=g.freight===''?'':Number(g.freight);
        if(!g.from){setErr(row,'from','必填');bad=true}if(!g.to){setErr(row,'to','必填');bad=true}
        if(Number(g.freight)>0&&!g.payeeId){setErr(row,'payeeId','有運費需指定應付對象');bad=true}return g});
      if(bad){toast('請修正標示紅色的欄位','err');return}
      const warns=[];
      lines.forEach(x=>{if(x.qty>x.max+1e-9){const l=o.lines.find(y=>y.id===x.lineId);warns.push(`${l.product}：累計安排出貨將超過訂單數量 ${l.qty} 的 +10%`)}});
      if(v.status==='已出貨'&&!v.exportDate)warns.push('尚未填寫出口報單日期，月結時將無法歸屬月份');
      if(warns.length&&!await confirmDlg('請確認',`⚠ ${warns.join('\n⚠ ')}\n\n此為警示，不阻擋儲存。是否繼續？`,'繼續儲存'))return;
      if(v.status==='已出貨'&&v.track==='未出貨')v.track='運送中';
      $('#sh_save',m).disabled=true;
      const res=await act({perm:'shipments'},()=>{
        const obj={...s,...v,orderId,lines:lines.map(({lineId,qty})=>({lineId,qty})),legs};
        if(!old){obj.id=nextShipId();db.shipments.push(obj);log('新增','出貨批次',o.id,`${obj.id}｜${obj.lines.map(x=>o.lines.find(l=>l.id===x.lineId)?.product+'×'+x.qty).join('、')}｜${obj.status}`)}
        else{db.shipments[db.shipments.findIndex(x=>x.id===old.id)]=obj;const ch=[];['status','actual','exportNo','exportDate','rate','eta','received','track'].forEach(k=>{if(String(old[k]??'')!==String(obj[k]??''))ch.push(`${k}：${old[k]||'（空）'} → ${obj[k]||'（空）'}`)});if(JSON.stringify(old.lines)!==JSON.stringify(obj.lines))ch.push('批次明細變更');if(JSON.stringify(old.legs)!==JSON.stringify(obj.legs))ch.push('運送段變更');log('修改','出貨批次',o.id,`${obj.id}｜${ch.join('；')||'無變更'}`)}
        refreshOrder(o,`出貨批次 ${obj.id}`);return obj;
      },old?'出貨批次已更新':'出貨批次已建立');
      if(!res.ok){$('#sh_save',m).disabled=false;return}
      closeModal();render();toast(`訂單 ${o.id} 目前狀態：${o.status}`,'info');
    };
  }
}
async function deleteShipment(id){
  const s=db.shipments.find(x=>x.id===id);if(s.status!=='待出貨')return toast('已出貨的批次不可刪除（資料不可遺失）','err');
  if(!await confirmDlg('刪除出貨批次',`確定刪除尚未出貨的批次 ${id}？`,'刪除',true))return;
  await act({perm:'shipments'},()=>{db.shipments=db.shipments.filter(x=>x.id!==id);log('刪除','出貨批次',s.orderId,id);refreshOrder(getOrder(s.orderId),`刪除批次 ${id}`)},'已刪除');render();
}

const INSP_METHODS=['小零件：工廠寄樣至台北','大型件：至南部工廠抽樣'];
function inspectionPage(){
  const f=ui.filter.insp||'全部',q=norm(ui.search);
  const list=db.inspection.filter(i=>(f==='全部'||i.result===f)&&(!q||norm(JSON.stringify(i)).includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.round-a.round);
  const rows=list.map(i=>{const o=getOrder(i.orderId),l=o?.lines.find(x=>x.id===i.lineId);const latest=o&&l&&lineInsps(o,l).pop()?.id===i.id;
    return `<tr class="clickrow" onclick="openInspectionForm({id:'${i.id}'})"><td><a class="filelink" onclick="event.stopPropagation();openOrderDetail('${i.orderId}','insp')">${esc(i.orderId)}</a></td><td>${esc(l?.product||'—')} / ${esc(l?.version||'')}</td><td>第 ${i.round} 輪</td><td>${esc(i.place)}<br><small class="muted">${esc(i.method)}</small></td><td>${esc(i.inspector)}</td><td>${esc(i.date)}</td><td>${tag(i.result)}</td><td style="white-space:normal;min-width:160px">${esc(i.reason||'—')}</td><td>${esc(i.redoDate||'—')}</td><td>${(i.reports||[]).length} 報告 / ${(i.images||[]).length} 圖</td><td><div class="rowactions">${latest&&i.result==='不合格'&&canEdit('inspection')&&!o.hold&&!o.cancelled?`<button class="mini go" onclick="event.stopPropagation();openInspectionForm({orderId:'${i.orderId}',lineId:'${i.lineId}'})">新增第 ${i.round+1} 輪</button>`:''}</div></td></tr>`}).join('');
  const pending=[];db.orders.filter(o=>!o.cancelled&&!o.closed&&!o.hold).forEach(o=>o.lines.forEach(l=>{if(lineInspStatus(o,l)==='待檢驗')pending.push({o,l})}));
  return head('管理各品項檢驗輪次、結果、圖片、報告與重做狀態（§4.6）。',canEdit('inspection')?`<button class="btn primary" onclick="openInspectionForm()">＋ 新增檢驗紀錄</button>`:'')+'<div class="notice">小零件：工廠寄樣品至台北並附檢驗報告，員工檢驗並核對報告。大型件：員工至南部工廠抽樣。不合格需記錄原因、通知工廠日期與預計重交日，狀態為「待工廠重做」；重做後新增下一輪檢驗，合格才可出貨。</div>'+(pending.length?panel('待檢驗品項',`${pending.length} 項`,table(['訂單','品項','供應商','生產完成日','操作'],pending.map(({o,l})=>`<tr><td>${esc(o.id)}</td><td>${esc(l.product)} / ${esc(l.version)}</td><td>${esc(l.supplier)}</td><td>${esc(l.prod?.doneDate||'—')}</td><td>${canEdit('inspection')?`<button class="mini go" onclick="openInspectionForm({orderId:'${o.id}',lineId:'${l.id}'})">新增檢驗</button>`:'—'}</td></tr>`).join(''))):'')+`<div class="chips">${['全部','合格','不合格'].map(c=>`<button class="chip ${f===c?'active':''}" onclick="setFilter('insp','${c}')">${c} <b>${db.inspection.filter(i=>c==='全部'||i.result===c).length}</b></button>`).join('')}</div>`+toolbar('搜尋訂單、檢驗人、原因...')+panel('檢驗紀錄',`共 ${list.length} 筆`,table(['訂單','品項','輪次','地點 / 方式','檢驗人','日期','結果','不合格原因','預計重交','附件','操作'],rows,'沒有符合條件的檢驗紀錄'));
}
function openInspectionForm(opt={}){
  const old=opt.id?db.inspection.find(i=>i.id===opt.id):null;
  const ro=!canEdit('inspection');
  if(!old&&ro)return toast('您沒有新增檢驗紀錄的權限','err');
  const i=old?clone(old):{id:null,orderId:opt.orderId||'',lineId:opt.lineId||'',batchRef:'',round:1,method:INSP_METHODS[0],place:'台北',inspector:currentUser()?.name||'',date:today(),result:'合格',reason:'',notifyDate:'',redoDate:'',reportChecked:false,images:[],reports:[],status:''};
  const orders=db.orders.filter(o=>o.id===i.orderId||(o.confirmed&&!o.cancelled&&!o.closed&&!o.hold&&o.lines.some(l=>l.prod?.status==='生產完成')));

  const FF=[{k:'reason',l:'不合格原因',t:'textarea',full:true,req:true},{k:'notifyDate',l:'通知工廠日期',t:'date',req:true},{k:'redoDate',l:'預計重新交貨日期',t:'date',req:true}];
  const body=`${ro?'<div class="notice blue">僅可檢視此檢驗紀錄。</div>':''}<div class="formgrid">

    <div class="field" data-field="lineId"><label>品項<span class="req">*</span></label><select id="in_line" ${old||ro?'disabled':''}></select><small class="authhint" id="in_hint"></small><small class="errmsg"></small></div>
    <div class="field"><label>檢驗輪次（自動）</label><input id="in_round" readonly></div>
    <div class="field"><label>關聯出貨批次（選填）</label><select id="in_batch" ${ro?'disabled':''}></select></div>
    ${F.map(f=>fieldHTML(f,i[f.k],ro)).join('')}</div>
    <div id="in_fail" class="formgrid" style="margin-top:13px">${FF.map(f=>fieldHTML(f,i[f.k],ro)).join('')}<p class="authhint full" style="grid-column:1/-1">儲存後狀態為「待工廠重做」。工廠重做後請新增下一輪檢驗，本輪紀錄保留。</p></div>
    <div class="formgrid" style="margin-top:13px">${fieldHTML({k:'images',l:'檢驗圖片',t:'files',kind:'image',full:true},null,ro)}${fieldHTML({k:'reports',l:'報告附件',t:'files',kind:'report',full:true},null,ro)}</div>`;
  // 假設：§4.6「檢驗紀錄關聯出貨批次」與 §4.4.2「檢驗合格後才可建立出貨批次」先後衝突，故檢驗主要關聯「訂單品項」，出貨批次為選填
  const m=showModal(old?`檢驗紀錄｜第 ${i.round} 輪`:'新增檢驗紀錄',body,ro?'<button class="btn secondary" onclick="closeModal()">關閉</button>':'<button class="btn secondary" onclick="closeModal()">取消</button><button class="btn primary" id="in_save">儲存檢驗紀錄</button>',{wide:true,noBackdropClose:!ro});
  initFileField($('.filefield[data-k="images"]',m),i.images);initFileField($('.filefield[data-k="reports"]',m),i.reports);

/* ========================================================================
 * [M] 應收應付與月結（§4.8，第二階段）
 *  應付 = 當月已出口貨款 + 運費（供應商墊付者）+ 公司自付運費（對貨運公司單獨計入）− 折讓 − 訂金沖銷
 *  應收 = 依實際出貨數量計算 − 客戶退款
 * ====================================================================== */
function computeSettlement(month){
  const batches=db.shipments.filter(s=>s.status==='已出貨'&&s.exportDate&&s.exportDate.slice(0,7)===month);
  const ar=[],ap={};
  const addAP=(sid,name,field,twd,detail)=>{const k=sid||name;ap[k]=ap[k]||{supplierId:sid,name,goods:0,freight:0,credit:0,deposit:0,details:[]};ap[k][field]+=twd;if(detail)ap[k].details.push(detail)};
  batches.forEach(s=>{const o=getOrder(s.orderId);if(!o)return;const rate=Number(s.rate)||0;let amt=0;
    s.lines.forEach(bl=>{const l=o.lines.find(x=>x.id===bl.lineId);if(!l||s.isReplacement)return; // 假設：補發批次不另收款、不另付款
      amt+=bl.qty*l.price;const sup=db.suppliers.find(x=>x.id===l.supplierId);addAP(l.supplierId,sup?.name||l.supplier||'（未指定供應商）','goods',toTWD(bl.qty*(Number(l.cost)||0),l.costCurrency||'TWD',rate),`${s.id} ${l.product}×${bl.qty}`)});
    if(!s.isReplacement)ar.push({party:o.customer,orderId:o.id,batch:s.id,exportDate:s.exportDate,amount:amt,currency:o.currency,rate,twd:toTWD(amt,o.currency,rate)});
    (s.legs||[]).forEach(g=>{if(g.payeeId&&Number(g.freight)>0){const sup=db.suppliers.find(x=>x.id===g.payeeId);addAP(g.payeeId,sup?.name||'?','freight',toTWD(g.freight,g.currency,rate),`${s.id} 運費（${g.payer}）`)}});
  });
  const refunds=db.accounting.filter(a=>a.type==='客戶退款'&&a.month===month).map(a=>({party:a.party,orderId:a.orderId,batch:'客戶退款',exportDate:'',amount:-a.amount,currency:a.currency,rate:a.rate,twd:-toTWD(a.amount,a.currency,a.rate),entryId:a.id}));
  db.accounting.filter(a=>a.type==='工廠折讓'&&a.month===month).forEach(a=>{const sup=db.suppliers.find(x=>x.id===a.supplierId);addAP(a.supplierId,sup?.name||a.party,'credit',toTWD(a.amount,a.currency,a.rate),`折讓 ${a.note||''}`)});
  const exported=new Set(batches.filter(b=>!b.isReplacement).map(b=>b.orderId));
  const deposits=db.accounting.filter(a=>a.type==='預付款（訂金）'&&((a.status==='待沖銷'&&exported.has(a.orderId))||a.offsetMonth===month));
  deposits.forEach(a=>{const sup=db.suppliers.find(x=>x.id===a.supplierId);addAP(a.supplierId,sup?.name||a.party,'deposit',toTWD(a.amount,a.currency,a.rate),`訂金沖銷 ${a.orderId}`)});
  const apList=Object.values(ap).map(x=>({...x,net:x.goods+x.freight-x.credit-x.deposit}));
  const arAll=[...ar,...refunds];
  return {batches,ar:arAll,ap:apList,deposits,missing:db.shipments.filter(s=>s.status==='已出貨'&&!s.exportDate),arTwd:arAll.reduce((a,x)=>a+x.twd,0),apTwd:apList.reduce((a,x)=>a+x.net,0)};
}
function accountingPage(){
  const tabs=[['settle','月結試算'],['entries','帳務單據'],['history','月結紀錄']],t=ui.acctTab;
  const months=[...new Set([today().slice(0,7),...db.shipments.map(s=>(s.exportDate||'').slice(0,7)).filter(Boolean),...db.settlements.map(x=>x.month)])].sort().reverse();
  if(!ui.acctMonth)ui.acctMonth=months[0];
  let content='';
  if(t==='settle'){
    const mo=ui.acctMonth,r=computeSettlement(mo),done=db.settlements.find(x=>x.month===mo);
    content=`<div class="toolbar"><label class="muted" style="font-size:12px">結算月份</label><select onchange="ui.acctMonth=this.value;render()">${months.map(x=>`<option ${x===mo?'selected':''}>${x}</option>`).join('')}</select>${done?`<span class="tag green">已月結｜${esc(done.at)}｜${esc(done.by)}</span>`:'<span class="tag orange">尚未月結</span>'}<span class="spacer"></span>${canEdit('accounting')?`<button class="btn primary" onclick="confirmSettlement('${mo}')">${done?'重新產生月結':'確認月結並產生單據'}</button>`:''}</div>
    ${r.missing.length?`<div class="notice">⚠ 有 ${r.missing.length} 個已出貨批次尚未填寫出口報單日期，無法歸屬月份：${r.missing.map(s=>`<a class="filelink" onclick="openShipmentForm({id:'${s.id}'})">${esc(s.id)}</a>`).join('、')}</div>`:''}

async function confirmSettlement(month){
  const r=computeSettlement(month);
  if(!r.batches.length&&!r.ar.length&&!r.ap.length)return infoDlg('無可結算項目',`${month} 沒有已出口的出貨批次或退款／折讓單據。`);
  const exists=db.settlements.find(x=>x.month===month);
  if(!await confirmDlg('確認月結',`${month} 月結：\n應收 TWD ${fmt(r.arTwd)}\n應付 TWD ${fmt(r.apTwd)}\n\n將產生應收／應付單據${r.deposits.length?`，並沖銷 ${r.deposits.length} 筆訂金`:''}。${exists?'\n\n⚠ 此月份已結算過，將覆蓋本月「未收款／未付款」的月結單據（已收付者保留）。':''}`,'確認月結'))return;
  await act({perm:'accounting'},()=>{
    const src='月結 '+month;
    db.accounting=db.accounting.filter(a=>!(a.source===src&&['未收款','未付款'].includes(a.status)));
    const has=(type,key)=>db.accounting.some(a=>a.source===src&&a.type===type&&a.key===key);
    r.ar.filter(x=>!x.entryId).forEach(x=>{if(!has('應收',x.batch))db.accounting.push({id:uid('A'),type:'應收',party:x.party,supplierId:'',orderId:x.orderId,amount:+x.amount.toFixed(2),currency:x.currency,rate:x.rate,month,status:'未收款',note:`批次 ${x.batch}`,source:src,key:x.batch})});
    r.ap.forEach(x=>{if(!has('應付',x.name))db.accounting.push({id:uid('A'),type:'應付',party:x.name,supplierId:x.supplierId||'',orderId:'',amount:+x.net.toFixed(2),currency:'TWD',rate:1,month,status:'未付款',note:`貨款 ${fmt(x.goods)}＋運費 ${fmt(x.freight)}－折讓 ${fmt(x.credit)}－訂金 ${fmt(x.deposit)}`,source:src,key:x.name})});
    r.deposits.forEach(a=>{a.status='已沖銷';a.offsetMonth=month});
    db.accounting.filter(a=>a.type==='工廠折讓'&&a.month===month).forEach(a=>{a.status='已沖銷'});
    db.settlements=db.settlements.filter(x=>x.month!==month);db.settlements.push({month,at:nowStr(),by:userLabel(),arTwd:r.arTwd,apTwd:r.apTwd,batches:r.batches.map(b=>b.id)});
    log('確認月結','帳務',month,`應收 TWD ${fmt(r.arTwd)}／應付 TWD ${fmt(r.apTwd)}`);
  },`${month} 月結完成，已產生應收應付單據`);
  render();
}

// §4.9 對內提醒剩餘收件日期
// 假設：「剩餘收件日」= 已出貨批次距客戶預計收件日的天數；另一併提醒訂單送貨日（21 天內）與工廠預計重交日
function reminders(){
  const t=today(),out=[];
  db.shipments.forEach(s=>{if(s.status==='已出貨'&&!s.received&&s.eta)out.push({type:'收件',days:daysBetween(t,s.eta),text:`批次 ${s.id}（訂單 ${s.orderId}）預計 ${s.eta} 送達客戶`,orderId:s.orderId})});
  db.orders.forEach(o=>{if(['已結案','已取消','已全部出貨','草稿'].includes(o.status)||!o.delivery)return;const d=daysBetween(t,o.delivery);if(d<=21)out.push({type:'送貨日',days:d,text:`訂單 ${o.id} 送貨日 ${o.delivery}，目前「${o.status}」`,orderId:o.id})});
  db.orders.forEach(o=>{if(o.cancelled||o.closed)return;o.lines.forEach(l=>{if(lineInspStatus(o,l)==='待重做'){const last=lineInsps(o,l).pop();if(last?.redoDate)out.push({type:'重交',days:daysBetween(t,last.redoDate),text:`訂單 ${o.id} ${l.product} 工廠預計 ${last.redoDate} 重交`,orderId:o.id})}})});
  return out.sort((a,b)=>a.days-b.days);
}
async function runDailyJob(){
  const res=await act(null,()=>{const r=reminders();db.reminderRun={at:nowStr(),by:userLabel(),count:r.length,overdue:r.filter(x=>x.days<0).length};log('執行每日提醒排程（模擬）','提醒',today(),`共 ${r.length} 則，逾期 ${db.reminderRun.overdue} 則`);return r});
  if(res.ok){toast(`排程完成：產生 ${res.r.length} 則提醒（逾期 ${db.reminderRun.overdue} 則）。正式版將寄信通知業務。`,'ok');render()}
}

// ---- 登入（§7.2 登入失敗次數限制；模擬）----
function renderLogin(){
  const users=db.users.filter(u=>u.active!==false);
  $('#loginroot').innerHTML=`<div class="loginback"><form class="logincard" id="loginForm" novalidate><div class="lbrand"><b>${esc(MOCK.company.name)}</b><small>${esc(MOCK.company.en)} · 訂單管理系統（互動展示原型）</small></div>
  <div class="field" data-field="lg_user"><label for="lg_user">帳號</label><select id="lg_user">${users.map(u=>`<option value="${u.id}">${esc(u.email)}（${esc(u.name)}｜${roles[u.role]}）</option>`).join('')}</select></div>
  <div class="field" data-field="lg_pw"><label for="lg_pw">密碼</label><input id="lg_pw" type="password" autocomplete="current-password" placeholder="展示密碼：${MOCK.demoPassword}"><small class="errmsg" id="lg_err"></small></div>
  <button class="btn primary" style="justify-content:center;padding:11px" id="lg_btn" type="submit">登入</button>
  <div class="notice blue" style="margin:0">展示環境：所有帳號密碼皆為 <b>${MOCK.demoPassword}</b>。連續失敗 ${MOCK.login.maxFail} 次將鎖定 ${MOCK.login.lockSeconds} 秒（模擬 §7.2）。正式系統由後端驗證、密碼以雜湊儲存，全站 HTTPS。</div></form></div>`;
  $('#loginForm').onsubmit=async e=>{
    e.preventDefault();const uidv=$('#lg_user').value,pw=$('#lg_pw').value,err=$('#lg_err'),btn=$('#lg_btn');err.textContent='';$('[data-field=lg_pw]').classList.remove('invalid');
    if(!pw){err.textContent='請輸入密碼';$('[data-field=lg_pw]').classList.add('invalid');return}
    btn.disabled=true;btn.textContent='登入中…';loading(true);await sleep(450);loading(false);btn.disabled=false;btn.textContent='登入';
    if(ui.simulateError){err.textContent='無法連線至伺服器（模擬 503），請稍後再試';return}
    const f=db.loginFails[uidv]||{count:0,until:0};
    if(f.until>Date.now()){err.textContent=`帳號已暫時鎖定，請於 ${Math.ceil((f.until-Date.now())/1000)} 秒後再試`;return}
    if(pw!==MOCK.demoPassword){f.count++;if(f.count>=MOCK.login.maxFail){f.until=Date.now()+MOCK.login.lockSeconds*1000;f.count=0;err.textContent=`密碼錯誤次數過多，帳號鎖定 ${MOCK.login.lockSeconds} 秒`}else err.textContent=`帳號或密碼錯誤（剩餘 ${MOCK.login.maxFail-f.count} 次嘗試）`;db.loginFails[uidv]=f;save();$('[data-field=lg_pw]').classList.add('invalid');return}
    delete db.loginFails[uidv];setSession(uidv);log('登入','使用者',currentUser().name,'');save();$('#loginroot').innerHTML='';ui.page='dashboard';render();toast(`歡迎，${currentUser().name}`,'ok');
  };
  setTimeout(()=>$('#lg_pw')?.focus(),50);
}
async function logout(){if(!await confirmDlg('登出','確定要登出嗎？','登出'))return;log('登出','使用者',currentUser()?.name,'');save();setSession(null);closeModal();renderLogin()}
async function resetDemo(){if(!await confirmDlg('重設展示資料','將清除本瀏覽器中所有變更，回復初始假資料。此動作無法復原。','重設',true))return;try{localStorage.removeItem(MOCK.storageKey)}catch(e){}db=loadDB();initStatuses();ui.page='dashboard';ui.filter={};closeModal();render();toast('已回復初始展示資料','ok')}
function setSimErr(on){ui.simulateError=on;const el=$('#simErr');if(el)el.checked=on;toast(on?'已開啟模擬 API 錯誤：之後的儲存與載入都會失敗':'已關閉模擬 API 錯誤',on?'warn':'ok')}

/* ========================================================================
 * [O] 導覽、頁面渲染與初始化
 * ====================================================================== */
const navItems=[['dashboard','▦','總覽儀表板','',''],['orders','▤','訂單管理','orders',''],['customers','♙','客戶管理','customers',''],['suppliers','▣','供應商管理','suppliers',''],['products','◈','產品管理','products',''],['drawings','▧','圖面管理','products',''],['prices','＄','產品價格歷史','prices',''],['shipments','⇢','出貨批次與運費','shipments',''],['inspection','✓','檢驗紀錄','inspection',''],['complaints','⚑','客訴與折讓','complaints','二階'],['accounting','▥','應收應付與月結','accounting','二階'],['inquiry','✉','新產品詢價','inquiry','三階'],['options','☷','下拉選項維護','options',''],['audit','◷','修改紀錄','audit',''],['users','♧','使用者與權限','users','']];
function renderNav(){
  const activeOrders=db.orders.filter(o=>!['已結案','已取消'].includes(o.status)).length;
  $('#nav').innerHTML=navItems.filter(([,,,key])=>!key||canView(key)).map(([id,ico,label,,ph])=>`<button class="nav ${ui.page===id?'active':''}" data-page="${id}"><span class="ico">${ico}</span>${label}${id==='orders'?`<span class="count">${activeOrders}</span>`:ph?`<span class="phase">${ph}</span>`:''}</button>`).join('');
  $$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
}
const title=()=>navItems.find(x=>x[0]===ui.page)?.[2]||'總覽儀表板';
function head(sub,btn=''){return `<div class="pagehead"><div><div class="eyebrow">${esc(MOCK.company.en)} / WORKSPACE</div><h1>${title()}</h1><p>${sub}</p></div>${btn}</div>`}
function setFilter(k,v){ui.filter[k]=v;render()}
function go(p){
  ui.page=p;ui.search='';ui.loadError=false;
  renderNav();$('#crumb').textContent=title();$('#view').innerHTML=skeleton(); // 載入狀態
  setTimeout(()=>{ui.loadError=ui.simulateError;render();window.scrollTo(0,0)},220);
}
function pageHTML(){
  switch(ui.page){
    case 'dashboard':return dashboard();case 'orders':return ordersPage();case 'shipments':return shipmentsPage();case 'inspection':return inspectionPage();
    case 'complaints':return complaintsPage();case 'accounting':return accountingPage();case 'inquiry':return inquiryPage();case 'audit':return auditPage();case 'users':return usersPage();
    default:return configs[ui.page]?modulePage(ui.page):head('找不到頁面')+'<div class="panel empty">找不到此頁面</div>';
  }
}
function ordersPage(){
  const f=ui.filter.orders||'全部',q=norm(ui.search);const sts=['全部',...ORDER_FLOW,'暫停處理','已取消'];
  const list=db.orders.filter(o=>(f==='全部'||o.status===f)&&(!q||norm([o.id,o.customer,o.customerPO,o.status,...o.lines.map(l=>`${l.product} ${l.description} ${l.supplier}`)].join(' ')).includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.id.localeCompare(a.id));
  const rows=list.map(o=>`<tr class="clickrow" onclick="openOrderDetail('${o.id}','lines')"><td><b>${esc(o.id)}</b></td><td>${esc(o.date)}</td><td>${esc(o.customer)}${o.customerId?'':' <span class="tag orange">單次</span>'}</td><td>${esc(o.customerPO||'—')}</td><td>${o.lines.length}</td><td>${fmt(orderTotal(o))} ${esc(o.currency)}</td><td>${esc(o.delivery||'—')}</td><td>${tag(o.status)}</td><td><div class="rowactions"><button class="mini" onclick="event.stopPropagation();openOrderDetail('${o.id}','lines')">詳情</button>${canEdit('orders')&&!o.cancelled&&!o.closed?`<button class="mini" onclick="event.stopPropagation();openOrderForm('${o.id}')">編輯</button>`:''}</div></td></tr>`).join('');
  return head('建立客戶訂單、管理多項產品明細、狀態流轉與原始訂單附件（§4.4）。',canEdit('orders')?`<button class="btn primary" onclick="openOrderForm()">＋ 新增訂單</button>`:'')+'<div class="notice blue">建立訂單時，客戶／供應商／產品皆為搜尋式下拉並自動帶入資料；不在清單中的資料可選擇「加入主檔」或「僅用於本訂單」。訂單主狀態由系統依生產、檢驗、出貨自動判斷；暫停、取消、結案限老闆與財務。</div>'+`<div class="chips">${sts.map(s=>`<button class="chip ${f===s?'active':''}" onclick="setFilter('orders','${s}')">${s} <b>${s==='全部'?db.orders.length:db.orders.filter(o=>o.status===s).length}</b></button>`).join('')}</div>`+toolbar('搜尋訂單編號、客戶、PO、料號、供應商...')+panel('訂單清單',`共 ${list.length} 筆`,table(['訂單編號','訂單日期','客戶','客戶 PO#','品項數','訂單總額','送貨日','狀態','操作'],rows,f!=='全部'||q?`沒有符合條件的訂單　<button class="mini" onclick="ui.search='';setFilter('orders','全部')">清除篩選</button>`:'尚無訂單，請按「新增訂單」建立第一張訂單'));
}
function renderView(){
  const v=$('#view');
  if(ui.loadError){v.innerHTML=head('')+`<div class="panel errorstate"><b>資料載入失敗</b><p>模擬 API 回應 503：伺服器暫時無法回應。</p><button class="btn primary" onclick="go(ui.page)">重新載入</button><p class="authhint">可於側邊欄關閉「模擬 API 錯誤」。</p></div>`;return}
  v.innerHTML=pageHTML();
  const s=$('#search');if(s)s.oninput=e=>{ui.search=e.target.value;const pos=e.target.selectionStart;renderView();const n=$('#search');if(n){n.focus();n.setSelectionRange(pos,pos)}};
}
function render(){
  if(!currentUser()){renderLogin();return}
  const item=navItems.find(n=>n[0]===ui.page);
  if(item&&item[3]&&!canView(item[3])){ui.page='dashboard';toast('目前角色無此功能權限，已返回總覽','warn')}
  renderNav();$('#crumb').textContent=title();
  const u=currentUser();$('#roleSelect').value=u.role;$('#avatar').textContent=u.name[0];$('#avatar').title=`${u.name}｜${u.email}`;
  renderView();
}
function initStatuses(){db.orders.forEach(o=>{o.status=deriveStatus(o)});save()}

// ---- 初始化 ----
$('#roleSelect').onchange=e=>{
  const r=e.target.value,u=db.users.find(x=>x.role===r&&x.active!==false);
  if(!u){toast('此角色目前沒有啟用中的使用者','err');e.target.value=curRole();return}
  setSession(u.id);log('切換角色（展示）','使用者介面',u.name,roles[r]);save();closeModal();toast(`已切換為 ${u.name}（${roles[r]}）`,'ok');render();
};
$('#simErr').onchange=e=>setSimErr(e.target.checked);
$('#resetBtn').onclick=resetDemo;
$('#logoutBtn').onclick=logout;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const d=$('#dialogroot').lastElementChild;if(d&&d._close)d._close(null)}});
$('#brandName').textContent=MOCK.company.short;$('#brandSub').textContent=MOCK.company.en+' · 訂單管理系統';document.title='訂單管理系統｜'+MOCK.company.name;
initStatuses();
render();
if(seedReplaced)toast('展示資料已更新為最新版本','info');
</script></body></html>
