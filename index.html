function modulePage(key){let c=configs[key],data=db[key]||[],q=searchTerm.toLowerCase();let rows=data.filter(r=>JSON.stringify(r).toLowerCase().includes(q)).map(r=>`<tr>${c.cols.map(([f])=>`<td>${f==='status'||f==='result'||f==='type'||f==='active'?tag(f==='active'?(r[f]===true?'啟用':r[f]===false?'停用':r[f]):r[f]):esc(r[f]??'—')}</td>`).join('')}<td><div class="rowactions"><button class="mini" onclick="openForm('${key}',${r.id})">${canEdit(key)?'編輯':'檢視'}</button>${key==='orders'&&access('cancel')==='edit'&&r.status!=='已取消'?`<button class="mini" onclick="cancelOrder(${r.id})">取消訂單</button>`:''}${canEdit(key)&&key!=='options'?`<button class="mini" onclick="removeRow('${key}',${r.id})">停用/刪除</button>`:''}</div></td></tr>`).join('');let hs=c.cols.map(x=>x[1]).concat('操作');let extra=key==='orders'?`<div class="notice blue">訂單可分批出貨；出貨數量容許訂單數量正負 10%，超出範圍時僅警示、不阻擋。建立訂單時可搜尋下拉、自動帶入資料；新資料可選擇加入主檔或僅用於本訂單。</div>`:key==='shipments'?`<div class="notice">運費與運送資料掛在出貨批次下；一批可設定多段運送。應付月結依出口報單日期歸屬月份。</div>`:key==='inspection'?`<div class="notice">不合格檢驗需記錄原因、通知工廠日期與預計重交日；重做後新增下一輪檢驗，合格後才可出貨。</div>`:key==='accounting'?`<div class="notice blue">台幣換算 = 外幣金額 × 匯率。應付包含已出口貨款、運費及折讓；訂金獨立列為預付款，出口時沖銷。</div>`:key==='products'?`<div class="notice blue">產品唯一識別為「客戶料號＋版本」；版本變更視為新產品。圖面可多筆管理（原檔、修改後檔、上傳日期、備註），3D STEP / IGES 僅提供下載。</div>`:'';return head(({customers:'維護客戶聯絡資料、寄送與付款地址。',suppliers:'管理工廠與貨運等供應商，貨運公司亦可列為應付對象。',products:'管理產品規格、版本、實體圖與多筆圖面。',prices:'保留產品歷史價格，依訂單日期帶入有效單價。',orders:'建立客戶訂單、管理多項產品明細與原始訂單附件。',shipments:'分批出貨、出口報單、匯率、運送段與運費追蹤。',inspection:'管理各批次檢驗輪次、結果、報告與重做狀態。',complaints:'記錄客訴、責任釐清、補發、客戶退款與工廠折讓。',accounting:'應收、應付、預付款、折讓與每月結算。',options:'產品處理選項可新增、編輯及停用；已使用選項不可刪除。'})[key],canEdit(key)?`<button class="btn primary" onclick="openForm('${key}')">＋ 新增${c.label}</button>`:'')+extra+toolbar(key,`搜尋${c.label}...`)+`<div class="panel"><div class="panelhead"><h3>${c.label}清單</h3><small>共 ${data.length} 筆</small></div>${table(hs,rows)}</div>`}
function dashboard(){let pending=db.shipments.filter(x=>x.status!=='已送達').length,openAR=db.accounting.filter(x=>x.type==='應收'&&x.status==='未收款').length,unpaid=db.accounting.filter(x=>x.type==='應付'&&x.status==='未付款').length;return head('掌握訂單、出貨、檢驗與帳務的即時狀態。')+`<div class="cards">${stat('訂單總數',db.orders.length,'累計建立訂單','▤')}${stat('待出貨批次',pending,'需持續追蹤','⇢')}${stat('待收款項',openAR,'應收帳款筆數','＄')}${stat('待付款項',unpaid,'應付帳款筆數','▥')}</div><div class="grid2"><div class="panel"><div class="panelhead"><h3>近期訂單</h3><button class="mini" onclick="go('orders')">查看全部 →</button></div>${table(['訂單編號','客戶','訂單日期','總額','狀態'],db.orders.slice().reverse().map(o=>`<tr><td><b>#${o.id}</b></td><td>${esc(o.customer)}</td><td>${esc(o.date)}</td><td>${Number(o.total).toLocaleString()} ${esc(o.currency)}</td><td>${tag(o.status)}</td></tr>`).join(''))}</div><div><div class="panel"><div class="panelhead"><h3>出貨進度</h3><small>依批次追蹤</small></div>${db.shipments.map(s=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;margin-bottom:7px;font-size:12px"><b>${esc(s.batch)}</b>${tag(s.status)}</div><div class="progress"><span style="width:${s.status==='已送達'?100:s.status==='運送中'?65:25}%"></span></div><small class="muted">訂單 #${esc(s.order)} · 預計 ${esc(s.planned||'未設定')}</small></div>`).join('')||'<div class="empty">尚無出貨批次</div>'}</div><div class="panel"><div class="panelhead"><h3>待處理事項</h3><small>工作提醒</small></div><div class="pillrow"><span class="pill">待出貨 ${pending}</span><span class="pill">不合格檢驗 ${db.inspection.filter(x=>x.result==='不合格').length}</span><span class="pill">未結案客訴 ${db.complaints.filter(x=>x.status!=='已結案').length}</span></div><p class="authhint">每日剩餘收件日提醒於正式後端排程執行；此原型以儀表板顯示示範資料。</p></div></div></div>`}

 const customer=$('#order_customer_lookup'),supplier=$('#line_supplier'),product=$('#line_product');
 const fillCustomer=()=>{let c=db.customers.find(x=>x.name.toLowerCase()===customer.value.trim().toLowerCase());if(c){$('#order_customer_ship').value=c.ship||'';$('#order_customer_bill').value=c.bill||'';$('#order_customer_contact').value=c.contact||'';}};
 const fillProduct=()=>{let p=db.products.find(x=>x.customerPart.toLowerCase()===product.value.trim().toLowerCase());if(!p)return;$('#line_company_part').value=p.companyPart||'';$('#line_description').value=p.description||'';$('#line_drawing').value=p.drawing||db.drawings.find(d=>(d.product||'').startsWith(p.customerPart))?.original||'';let orderDate=$('#f_date')?.value||new Date().toISOString().slice(0,10);let price=db.prices.filter(x=>(x.product||'').startsWith(p.customerPart)&&x.effective<=orderDate).sort((a,b)=>b.effective.localeCompare(a.effective))[0];if(price){$('#line_price').value=price.price;$('#line_unit').value=price.unit||'EA';if($('#f_currency'))$('#f_currency').value=price.currency||'USD';}};
 customer.addEventListener('change',fillCustomer);customer.addEventListener('blur',()=>{let v=customer.value.trim();if(!v||db.customers.some(x=>x.name.toLowerCase()===v.toLowerCase()))return;let hasEdit=canEdit('customers');let add=confirm(`「${v}」不在客戶清單中。\n按「確定」${hasEdit?'加入客戶管理並帶入本訂單':'僅用於本張訂單（目前沒有客戶主檔編輯權限）'}；按「取消」返回修改。`);if(!add){customer.focus();return;}if(hasEdit){let ship=prompt('客戶寄送地址（可留空）')||'',bill=prompt('客戶付款地址（可留空）')||'',contact=prompt('聯絡人姓名（可留空）')||'';db.customers.push({id:Date.now(),name:v,ship,bill,contact,phone:'',fax:'',email:'',contactPhone:''});save();log('新增','客戶',v);$('#customer_options').innerHTML+=`<option value="${esc(v)}"></option>`;} });
 supplier.addEventListener('blur',()=>{let v=supplier.value.trim();if(!v||db.suppliers.some(x=>x.name.toLowerCase()===v.toLowerCase()))return;let hasEdit=canEdit('suppliers');let add=confirm(`「${v}」不在供應商清單中。\n按「確定」${hasEdit?'加入供應商管理並帶入本訂單':'僅用於本張訂單（目前沒有供應商主檔編輯權限）'}；按「取消」返回修改。`);if(!add){supplier.focus();return;}if(hasEdit){let type=prompt('供應商類型：工廠／貨運／其他','工廠')||'工廠',contact=prompt('聯絡人（可留空）')||'',email=prompt('Email（可留空）')||'';db.suppliers.push({id:Date.now()+1,name:v,type,contact,email,phone:''});save();log('新增','供應商',v);$('#supplier_options').innerHTML+=`<option value="${esc(v)}"></option>`;}});
 product.addEventListener('change',fillProduct);product.addEventListener('blur',()=>{let v=product.value.trim();if(!v||db.products.some(x=>x.customerPart.toLowerCase()===v.toLowerCase()))return;let hasEdit=canEdit('products');let add=confirm(`產品「${v}」不在清單中。\n按「確定」${hasEdit?'加入產品管理並帶入本訂單':'僅用於本張訂單（目前沒有產品主檔編輯權限）'}；按「取消」返回修改。`);if(!add){product.focus();return;}if(hasEdit){let companyPart=prompt('工廠／本公司產品編號',v)||v,version=prompt('產品版本','A')||'A',description=prompt('Description（可留空）')||'';if(db.products.some(x=>x.customerPart===v&&x.version===version))return alert('客戶料號與版本已存在，請選取既有產品。');db.products.push({id:Date.now()+2,customerPart:v,companyPart,version,description,material:'',supplier:supplier.value});save();log('新增','產品',v+' / '+version);$('#product_options').innerHTML+=`<option value="${esc(v)}"></option>`;fillProduct();}});
}
function saveForm(key,id){let c=configs[key],obj={id:id||Date.now()};c.fields.forEach(([f])=>{let el=$('#f_'+f);obj[f]=el?.value??''});if(key==='orders'){
 obj.customer=$('#order_customer_lookup').value.trim();obj.ship=$('#order_customer_ship').value;obj.bill=$('#order_customer_bill').value;obj.contact=$('#order_customer_contact').value;
 let sup=$('#line_supplier').value.trim(),prod=$('#line_product').value.trim();let p=db.products.find(x=>x.customerPart.toLowerCase()===prod.toLowerCase());let qty=Number($('#line_qty').value),price=Number($('#line_price').value);obj.lines=[{supplier:sup,product:prod,companyPart:$('#line_company_part').value,description:$('#line_description').value,drawing:$('#line_drawing').value,qty,unit:$('#line_unit').value,price,handling:$('#line_handling').value,masterProductId:p?.id||null}];obj.total=qty*price;obj.status=obj.status||'待處理';if(!id)obj.id=80386+Math.floor(Math.random()*10000);
 }if(key==='options')obj.active=obj.active==='啟用';if(key==='products'){let dupe=db.products.find(x=>x.id!==id&&x.customerPart===obj.customerPart&&x.version===obj.version);if(dupe)return alert('客戶料號與版本已存在，請確認避免重複建檔。')}let arr=db[key],i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]={...arr[i],...obj};else arr.push(obj);log(i>=0?'修改':'新增',c.label,JSON.stringify(obj).slice(0,160));save();closeModal();render()}
function cancelOrder(id){if(!confirm('確定取消此訂單？系統將保留訂單及操作紀錄。'))return;let o=db.orders.find(x=>x.id===id);if(o){o.status='已取消';log('取消訂單','訂單',`#${id}`);save();render()}}
function removeRow(key,id){if(!confirm('確定停用或刪除此筆資料？已被使用的選項不可刪除。'))return;if(key==='options'){let x=db.options.find(x=>x.id===id);x.active=false}else{db[key]=db[key].filter(x=>x.id!==id)}log(key==='options'?'停用':'刪除',configs[key].label,'ID '+id);save();render()}
function showModal(title,body,foot){$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modalbody">${body}</div><div class="modalfoot">${foot}</div></div></div>`}function closeModal(){$('#modalroot').innerHTML=''}
$('#roleSelect').onchange=e=>{role=e.target.value;localStorage.setItem('afcoDemoRole',role);log('切換角色','使用者介面',roles[role]);render()};render();
</script></body></html>
